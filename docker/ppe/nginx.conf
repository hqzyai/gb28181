map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $wvp_upstream wvp:18978;
    set $media_upstream media:28081;
    root /opt/dist;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /healthz {
        access_log off;
        proxy_pass http://$wvp_upstream/;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/(api/|channel/|record_proxy/|doc\.html|swagger-ui|v3/api-docs) {
        proxy_pass http://$wvp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ~ ^/(rtp/|live/|record/|mp4_record/) {
        proxy_pass http://$media_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /index/api/ { return 404; }
    location /index/hook/ { return 404; }
}
